appId: com.shortdrama.studio
productName: Short Drama Studio
copyright: Copyright © 2026 Short Drama Studio contributors
beforePack: scripts/check-studio-package.cjs

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - LICENSE.txt
  - NOTICES.md
  - licenses/**/*
  - resources/studio-icon.png
  - resources/studio-icon.ico
  - "!**/*.map"

asarUnpack:
  - dist/splash/**

extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*.py"
      - "short_drama/skills/**/*.md"
      - "short_drama/skills/**/*.txt"
      - "short_drama/skills/**/*.yaml"
      - "short_drama/skills/**/*.json"
      - "short_drama/prompts/**/*.md"
      - "short_drama/runtime/*.cjs"
      - "short_drama/agent_runtime/tokenizer/*"
      - pyproject.toml
      - runtime_config/lora_catalog.json
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!.venv/**"
      - "!outputs/**"
      - "!models/**"
      - "!tests/**"
      # The short-drama product does not run or distribute the upstream LTX model backend.
      - "!services/**"
      - "!handlers/**"
      - "!ltx2_server.py"
  - from: python-deps-hash.txt
    to: python-deps-hash.txt

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/studio-icon.ico
  artifactName: ${productName}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: resources/installer.nsh
  installerIcon: resources/studio-icon.ico
  uninstallerIcon: resources/studio-icon.ico
  installerHeaderIcon: resources/studio-icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Short Drama Studio

mac:
  hardenedRuntime: true
  extendInfo:
    NSMicrophoneUsageDescription: Short Drama Studio uses the microphone only when you record an optional character voice reference.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
  signIgnore:
    # Skip non-binary files in the bundled Python environment during codesign.
    # Without this, @electron/osx-sign walks all ~25k files to find ~360 Mach-O
    # binaries, hitting the macOS 10240 open-files-per-process limit.
    - "/python/.*\\.(py|pyc|pyi|pxd|pyx|h|hpp|cpp|c|cuh|cu|tcl|txt|json|yaml|yml|toml|cfg|md|rst|html|css|enc|msg|cmake|gif|png|jpg|svg|xml|jinja|typed|al)$"
    - "/python/.*\\.dist-info/"
    # The prebuilt mpsgraph_zc cache's relocatable object is Mach-O but never loaded
    # (only its .so is dlopen'd); skip signing it — codesign rejects relocatable .o.
    - "/python/mps-ext-prebuilt/.*\\.o$"
  extraResources:
    # python-embed includes the prebuilt mps-sdpa mpsgraph_zc extension under
    # mps-ext-prebuilt/ (prepare-python.sh Step 6.5), so it's bundled to
    # resources/python/mps-ext-prebuilt — where LTX_MPS_EXT_PREBUILT_DIR points.
    - from: python-embed
      to: python
      filter:
        - "**/*"
        - "!__pycache__/**"
        - "!*.pyc"
        - "!**/site-packages/ltx_core/**"
        - "!**/site-packages/ltx_pipelines/**"
        - "!**/site-packages/ltx_core-*.dist-info/**"
        - "!**/site-packages/ltx_pipelines-*.dist-info/**"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: resources/studio-icon.icns
  category: public.app-category.video
  artifactName: ${productName}-${arch}.${ext}

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - AppImage
    - deb
  icon: resources/icons
  category: Video
  artifactName: ${productName}-${arch}.${ext}

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

publish: null
